<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ミニブラウザヒーロー</title>
  <link rel="stylesheet" href="style.css" />

    <!-- Cloudflare Web Analytics -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"f48e7088e55c41f4a0a6044f8bf3531b"}'></script>
    <!-- End Cloudflare Web Analytics -->
</head>
<body>
  <div id="game">
    <header class="topbar">
      <div class="brand">ミニブラウザヒーロー</div>
      <div class="resources"><b id="chests">0</b> 宝箱 / <b id="mats">0</b> 強化石</div>
      <div class="controls">
        <button id="equipToggleBtn">メニュー</button>
        <button id="debugBtn">デバッグ</button>
        <label class="volume-control">音量 <input id="volumeSlider" type="range" min="0" max="200" value="100" step="1"><span id="volumeText">100%</span></label>
      </div>
    </header>

    <main class="layout">
      <section class="battle-panel">
        <div class="battle-bg"></div>
        <div class="battle-vignette"></div>
        <div id="levelEffect" class="level-effect hidden"><img src="assets/fx_levelup.png"><span>LEVEL UP!</span></div>
        <div id="centerBanner" class="center-banner hidden"></div>
        <div id="audioHint" class="audio-hint hidden">クリックで音声ON</div>

        <div class="enemy-zone">
          <div class="name-line"><span id="enemyName">スライム</span><span id="enemyLevel" class="enemy-level">Lv.1</span><b id="enemyTag"></b></div>
          <div class="hpbar enemy-hp"><div id="enemyHpFill"></div><span id="enemyHpText"></span></div>
          <div id="enemyCard" class="card enemy-card">
            <img id="enemyImg" src="assets/enemy_slime.jpg" alt="敵" />
            <div class="card-flash"></div>
            <div id="enemyEffectLayer" class="effect-layer"></div>
            <div id="enemyFloats" class="float-layer"></div>
          </div>
        </div>

        <div class="hero-zone">
          <div class="name-line"><span>騎士</span><em id="deathDanceStatus" class="dance-status hidden">死線の剣舞 残り10秒</em><b id="heroLevel">Lv.1</b></div>
          <div class="hpbar hero-hp"><div id="heroHpFill"></div><span id="heroHpText"></span></div>
          <div id="heroCard" class="card hero-card">
            <img src="assets/hero_card.jpg" alt="主人公" />
            <div id="deathAura" class="death-aura hidden"></div>
            <div id="downOverlay" class="down-overlay hidden"><div class="down-text">DOWN...</div><strong id="downCount">5</strong></div>
            <div class="card-flash"></div>
          </div>
        </div>
        <div class="expbar"><div id="expFill"></div><span id="expLabel">Lv.1 EXP 0 / 80</span><b id="expGainLabel">+0</b></div>
      </section>

      <aside class="side-panel">
        <div class="menu-col menu-left">
        <div class="panel hero-stats">
          <h2>ステータス</h2>
          <div class="stat-grid">
            <span>Lv</span><b id="statLv">1</b>
            <span>現在Lv経験値</span><b id="statXp">0 / 80</b>
            <span>次Lv必要</span><b id="statXpNext">80</b>
            <span>獲得経験値</span><b id="statXpGain">0</b>
            <span>攻撃力</span><b id="statAtk">42</b>
            <span>防御力</span><b id="statDef">12</b>
            <span>火軽減</span><b id="statFireRes">0%</b>
            </div>
        </div>

        <div class="panel equip-panel">
          <h2>現在装備</h2>
          <div id="equipList" class="equip-list"></div>
          <button id="upgradeBtn" class="wide">装備を選択して強化</button>
        </div>

        </div>
        <div class="menu-col menu-right">
        <div class="panel inventory-panel">
          <h2>倉庫</h2>
          <div class="inventory-actions">
            <button id="openAllBtn">一括開封</button>
            <button id="bestEquipBtn">最強装備</button>
            <button id="sellNormalBtn">ノーマル売却</button>
            <button id="sellRareBtn">レア売却</button>
            <button id="sellAllBtn">すべて売却</button>
          </div>
          <div id="inventory" class="inventory"></div>
          <div id="tooltip" class="tooltip hidden"></div>
        </div>

        <div class="panel log-panel">
          <h2>バトルログ</h2>
          <div id="log" class="log"></div>
        </div>
        </div>
      </aside>
    </main>
      <div id="debugPanel" class="debug-panel hidden">
        <div class="debug-head">デバッグ</div>
        <button id="debugAddChests">宝箱+50</button>
        <button id="debugBestSword">最強剣を倉庫に付与</button>
        <button id="debugBestAccessory">最強アクセを倉庫に付与</button>
        <label><input id="debugKillEnemy" type="checkbox"> 敵への攻撃で即死</label>
        <label><input id="debugKillHero" type="checkbox"> 敵からの攻撃で即死</label>
        <button id="debugClose">閉じる</button>
      </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
