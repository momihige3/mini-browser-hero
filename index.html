<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ミニブラウザヒーロー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="title-panel">
      <div class="title-mark">⚔</div>
      <div>
        <h1>ミニブラウザヒーロー</h1>
        <p>自動戦闘・ステージ進行・装備ハクスラ</p>
      </div>
      <div class="top-stats">
        <span>Lv <b id="lv">1</b></span>
        <span>Gold <b id="gold">0</b></span>
        <span>Stage <b id="stage">1-1</b></span>
        <span>宝箱 <b id="chests">0</b></span>
      </div>
    </header>

    <section class="battle-panel">
      <div class="stage-badge" id="battleStage">1-1</div>
      <div class="bg-sky"></div>
      <div class="ground"></div>
      <div id="enemy" class="unit enemy walking">
        <div class="enemy-body"><span></span></div>
        <div class="unit-name" id="enemyName">スライム</div>
      </div>
      <div id="hero" class="unit hero">
        <div class="hero-head"></div>
        <div class="hero-body"></div>
        <div class="hero-sword"></div>
      </div>
      <div id="slash" class="slash"></div>
      <div id="damageText" class="damage-text"></div>
      <div id="stageClear" class="center-pop">STAGE CLEAR!</div>
      <div id="levelUp" class="center-pop level">LEVEL UP!</div>
      <div id="chestAnim" class="chest-anim">📦</div>
    </section>

    <section class="bars">
      <div class="bar-box"><label>英雄HP <b id="heroHpText"></b></label><div class="bar"><i id="heroHpBar"></i></div></div>
      <div class="bar-box"><label>敵HP <b id="enemyHpText"></b></label><div class="bar enemybar"><i id="enemyHpBar"></i></div></div>
      <div class="bar-box"><label>EXP <b id="expText"></b></label><div class="bar expbar"><i id="expBar"></i></div></div>
    </section>

    <section class="main-grid">
      <section class="window inventory-window">
        <div class="window-title">倉庫</div>
        <div class="inventory-toolbar">
          <button id="openChestBtn" class="btn primary">宝箱を開ける ×<span id="openChestCount">0</span></button>
          <button id="sortBtn" class="btn">整頓</button>
        </div>
        <div id="inventory" class="inventory"></div>
      </section>

      <section class="window hero-window">
        <div class="window-title">英雄</div>
        <div class="stats-grid">
          <div>攻撃力 <b id="atk">0</b></div>
          <div>防御力 <b id="def">0</b></div>
          <div>最大HP <b id="maxHp">0</b></div>
          <div>攻撃速度 <b id="speed">0</b></div>
          <div>撃破 <b id="kills">0/5</b></div>
        </div>
        <div id="equips" class="equips"></div>
        <div class="upgrade-list">
          <button id="weaponUp" class="btn">武器強化 Lv<span id="weaponLv">1</span><small id="weaponCost"></small></button>
          <button id="armorUp" class="btn">防具強化 Lv<span id="armorLv">1</span><small id="armorCost"></small></button>
          <button id="ringUp" class="btn">指輪強化 Lv<span id="ringLv">1</span><small id="ringCost"></small></button>
        </div>
      </section>

      <section class="window system-window">
        <div class="window-title">設定・冒険</div>
        <div class="control-line">
          <button id="muteBtn" class="btn">🔊 SE ON</button>
          <label>音量 <input id="volume" type="range" min="0" max="100" value="35"></label>
        </div>
        <div class="control-line">
          <label>ステージ <select id="stageSelect"></select></label>
          <button id="goStage" class="btn">移動</button>
        </div>
        <div class="control-line">
          <button id="healBtn" class="btn">回復</button>
          <button id="saveBtn" class="btn">保存</button>
          <button id="resetBtn" class="btn danger">リセット</button>
        </div>
        <div id="log" class="log"></div>
      </section>
    </section>
  </main>

  <div id="tooltip" class="tooltip"></div>
  <div id="itemMenu" class="item-menu"></div>
  <script src="game.js"></script>
</body>
</html>
