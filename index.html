<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ミニブラウザヒーロー</title>
  <link rel="stylesheet" href="style.css" />

    <!-- Cloudflare Web Analytics -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"f48e7088e55c41f4a0a6044f8bf3531b"}'></script>
    <!-- End Cloudflare Web Analytics -->
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <div id="fixedBuildVersion" class="fixed-build-version">ver.98.6</div>
  <div id="game">
    <header class="topbar">
      <div class="brand">ミニブラウザヒーロー <span class="build-version">ver.98.6</span></div>
      <div class="resources"><b id="mats">0</b> 強化石</div>
      <div class="controls">
        <button id="equipToggleBtn">メニュー</button>
        <button id="debugBtn">デバッグ</button>
        <button id="muteBtn" class="mute-btn" type="button" aria-pressed="true">🔇 ミュート</button>
        <label class="volume-control">音量 <input id="volumeSlider" type="range" min="0" max="200" value="100" step="1"><span id="volumeText">100%</span></label>
      </div>
    </header>

    <main class="layout">
      <section class="battle-panel">
        <div class="battle-bg"></div>
        <div class="battle-vignette"></div>
        <div id="levelEffect" class="level-effect hidden"><img src="assets/fx_levelup.png"><span>LEVEL UP!</span></div>
        <div id="centerBanner" class="center-banner hidden"></div>
        <div id="dropToast" class="drop-toast hidden"></div>
        <div id="audioHint" class="audio-hint hidden">クリックで音声ON</div>

        <div class="enemy-zone">
          <div class="name-line"><span id="enemyName">スライム</span><span id="enemyLevel" class="enemy-level">Lv.1</span><b id="enemyTag"></b></div>
          <div class="hpbar enemy-hp"><div id="enemyHpFill"></div><span id="enemyHpText"></span></div>
          <div id="enemyCard" class="card enemy-card">
            <img id="enemyImg" src="assets/enemy_slime.jpg" alt="敵" />
            <div class="card-flash"></div>
            <div id="enemyEffectLayer" class="effect-layer"></div>
            <div id="enemyFloats" class="float-layer"></div>
          </div>
          <div id="enemyStatusList" class="status-list" aria-label="敵の状態"></div>
        </div>

        <div class="hero-zone">
          <div class="name-line"><span>騎士</span><em id="deathDanceStatus" class="dance-status hidden">死線の剣舞 残り10秒</em><b id="heroLevel">Lv.1</b></div>
          <div class="hpbar hero-hp"><div id="heroHpFill"></div><span id="heroHpText"></span></div>
          <div id="heroCard" class="card hero-card">
            <img src="assets/hero_card.jpg" alt="主人公" />
            <div id="deathAura" class="death-aura hidden"></div>
            <div id="downOverlay" class="down-overlay hidden"><div class="down-text">DOWN...</div><strong id="downCount">5</strong></div>
            <div class="card-flash"></div>
          </div>
          <div id="heroStatusList" class="status-list" aria-label="主人公の状態"></div>
        </div>
        <div class="expbar"><div id="expFill"></div><span id="expLabel">Lv.1 EXP 0 / 80</span><b id="expGainLabel">+0</b></div>
        <button id="fleeBtn" class="flee-btn" type="button">戦闘から逃げる</button>
      </section>

      <aside class="side-panel">
        <nav class="mobile-menu-tabs" aria-label="メニューページ切り替え">
          <button type="button" data-menu-page="stats" class="active">ステータス</button>
          <button type="button" data-menu-page="equip">装備/強化</button>
          <button type="button" data-menu-page="inventory">倉庫</button>
          <button type="button" data-menu-page="log">ログ</button>
        </nav>
        <div class="menu-col menu-left">
        <div class="panel hero-stats">
          <h2>ステータス</h2>
          <div class="stat-grid">
            <span>Lv</span><b id="statLv">1</b>
            <span>現在Lv経験値</span><b id="statXp">0 / 80</b>
            <span>次Lv必要</span><b id="statXpNext">80</b>
            <span>獲得経験値</span><b id="statXpGain">0</b>
            <span>攻撃力</span><b id="statAtk">42</b>
            <span>防御力</span><b id="statDef">12</b>
            <span>火軽減</span><b id="statFireRes">0%</b>
            </div>
          <div class="monster-records">
            <h3>モンスター討伐記録</h3>
            <div id="monsterRecords" class="monster-record-list"></div>
          </div>
        </div>

        <div class="panel equip-panel">
          <h2>現在装備</h2>
          <div id="equipList" class="equip-list"></div>
          <button id="upgradeBtn" class="wide">装備を選択して強化</button>
        </div>

        </div>
        <div class="menu-col menu-right">
        <div class="panel inventory-panel">
          <h2>倉庫</h2>
          <div class="inventory-actions">
            <button id="bestEquipBtn">最強装備</button>
            <div class="sell-box">
              <button id="sellSelectedBtn">経験値化</button>
              <label><input id="sellNormalChk" type="checkbox" checked>ノーマル</label>
              <label><input id="sellRareChk" type="checkbox">レア</label>
              <label><input id="sellLegendaryChk" type="checkbox">レジェンダリー</label>
            </div>
          </div>
          <div id="inventory" class="inventory"></div>
          <div id="tooltip" class="tooltip hidden"></div>
        </div>

        <div class="panel log-panel">
          <h2>バトルログ</h2>
          <div id="log" class="log"></div>
        </div>
        <div class="legal-links" aria-label="公開情報">
          <button id="creditBtn" type="button">クレジット</button>
          <button id="termsBtn" type="button">利用規約</button>
          <button id="privacyBtn" type="button">プライバシーポリシー</button>
        </div>
        </div>
      </aside>
    </main>
      <div id="debugPanel" class="debug-panel hidden">
        <div class="debug-head">デバッグ</div>
        <button id="debugAddChests">装備+50</button>
        <button id="debugResetData">ユーザーデータリセット</button>
        <button id="debugDarkSwordSaint">暗黒剣聖を強制召喚</button>
        <label><input id="debugKillEnemy" type="checkbox"> 敵への攻撃で即死</label>
        <label><input id="debugKillHero" type="checkbox"> 敵からの攻撃で即死</label>
        <div class="debug-version">Build: ver.98.6.2</div>
        <button id="debugClose">閉じる</button>
      </div>
  </div>

  <div id="legalModal" class="legal-modal hidden" role="dialog" aria-modal="true" aria-labelledby="legalModalTitle">
    <div class="legal-modal-backdrop" data-legal-close="1"></div>
    <div class="legal-modal-card">
      <button id="legalModalClose" class="legal-modal-close" type="button" aria-label="閉じる">×</button>
      <h2 id="legalModalTitle">クレジット</h2>
      <div id="legalModalBody" class="legal-modal-body"></div>
    </div>
  </div>


  <div id="deathDanceCutin" class="death-dance-cutin hidden" aria-live="polite">
    <div class="death-dance-cutin-strip">
      <img id="deathDanceCutinImg" src="assets/cutin_eye_1.jpg" alt="剣舞カットイン" />
      <div id="deathDanceCutinQuote" class="death-dance-cutin-quote">負けるわけにはいかない！</div>
    </div>
    <div class="death-dance-cutin-title">死線の剣舞</div>
  </div>

  <div id="fleeModal" class="flee-modal hidden" role="dialog" aria-modal="true" aria-labelledby="fleeModalTitle">
    <div class="flee-modal-backdrop"></div>
    <div class="flee-modal-card">
      <h2 id="fleeModalTitle">戦闘から離脱しますか？</h2>
      <p>敵の出現レベルが20下がります。<br>経験値は失いません。</p>
      <div class="flee-modal-actions">
        <button id="fleeCancelBtn" type="button">いいえ</button>
        <button id="fleeOkBtn" type="button">はい</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>


















<style id="v986-hard-ui-debug-fix-style">
html,body{min-height:100%;overflow-y:auto!important}
button,.btn,[role="button"],input,select,label{touch-action:manipulation!important;pointer-events:auto!important}
#gameVersion,.game-version,.version-label{pointer-events:none!important;z-index:99999!important}
#menuPanel,.menu-panel,#debugPanel,.debug-panel,.modal,.dialog,.popup,#mobileMenuPanel,.mobile-menu-panel,#sidePanel,.side-panel,.right-panel{
  max-height:calc(100dvh - 96px)!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;
  box-sizing:border-box!important;padding-bottom:96px!important;pointer-events:auto!important
}
#menuPanel *,.menu-panel *,#debugPanel *,.debug-panel *,.modal *,.dialog *,.popup *{pointer-events:auto!important}
.cutin,.cutin-overlay,#cutin,#cutinOverlay,.boss-intro,.dark-cutin{pointer-events:none!important}
.v986-panel-tabs{display:flex;gap:6px;padding:4px 8px;border-bottom:1px solid rgba(212,160,42,.65);background:rgba(14,8,3,.96);position:sticky;top:0;z-index:4000}
.v986-panel-tabs button{flex:1;min-height:34px;border:1px solid #b78a24;background:rgba(48,28,7,.92);color:#ffe09a;border-radius:4px;font-weight:700}
.v986-panel-tabs button.active{background:rgba(120,84,20,.98);box-shadow:inset 0 0 0 1px #ffd15b}
.v986-tab-hidden{display:none!important}
@media (pointer:coarse),(max-width:820px){
 #fleeBtn,.flee-btn,#fleeButton,.escape-btn,#escapeBtn{min-width:44px!important;width:44px!important;height:44px!important;padding:0!important;border-radius:999px!important;font-size:0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important}
 #fleeBtn::before,.flee-btn::before,#fleeButton::before,.escape-btn::before,#escapeBtn::before{content:"🏃";font-size:24px}
 .status-popup-close,.buff-popup-close,.debuff-popup-close,.status-detail-close,#statusDetailClose,#statusPopupClose,.tooltip-close,.popup-close.status-close{display:none!important}
}
</style>
<script id="v986-hard-ui-debug-fix-script">
(function(){
 const VERSION="ver.98.6";
 const DARK_EQUIP_NAMES=["闇の聖剣","闇の盾","闇のアミュレット","闇の鎧","闇の籠手","闇の兜","暗黒の靴"];
 function ensureVersion(){
   const title=document.querySelector(".title,#title,.game-title,h1")||document.body;
   document.querySelectorAll("#gameVersion,.game-version,.version-label").forEach((el,i)=>{if(i>0)el.remove()});
   let v=document.getElementById("gameVersion")||document.querySelector(".game-version,.version-label");
   if(!v){v=document.createElement("span");v.id="gameVersion";v.className="game-version";title.style.position=title.style.position||"relative";title.appendChild(v)}
   v.textContent=VERSION;
   Object.assign(v.style,{position:"absolute",right:"0",bottom:"-0.85em",fontSize:(matchMedia("(pointer:coarse)").matches?"10px":"12px"),opacity:"0.75",whiteSpace:"nowrap"});
 }
 function log(m){try{if(typeof addLog==="function")addLog(m,"system");else console.log(m)}catch(e){console.log(m)}}
 function uid(){return"it_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
 function st(){return(window.state&&typeof window.state==="object"&&window.state)||(window.gameState&&typeof window.gameState==="object"&&window.gameState)||(window.saveData&&typeof window.saveData==="object"&&window.saveData)||null}
 function storageArray(){
   const s=st(), names=["inventory","storage","warehouse","items","bag"];
   for(const n of names){if(Array.isArray(window[n]))return window[n];if(s&&Array.isArray(s[n]))return s[n]}
   if(s){s.inventory=[];return s.inventory} window.inventory=[];return window.inventory;
 }
 function lv(){const s=st();return Number((window.player&&(window.player.level||window.player.lv))||(s&&(s.level||s.playerLevel))||1)||1}
 function makeDarkEquip(name){
   const n=Math.max(1,lv());
   const slotMap={"闇の聖剣":"weapon","闇の盾":"shield","闇のアミュレット":"amulet","闇の鎧":"armor","闇の籠手":"gloves","闇の兜":"helmet","暗黒の靴":"boots"};
   const effects={
    "闇の聖剣":["通常攻撃・剣舞1ヒットごとに暗黒出血10%","連続攻撃100%"],
    "闇の盾":["毎ターン被ダメージ軽減+1%(最大50%)","被ダメージの50%回復"],
    "闇のアミュレット":["死線の剣舞発動率+25%","死線の剣舞効果時間2倍"],
    "闇の鎧":["被ダメージ25%軽減","1秒ごとにHP2%回復","暗黒出血最大20スタック"],
    "闇の籠手":["死線の剣舞時、剣舞発動回数+2"],
    "闇の兜":["死線の剣舞発動率+10%","出血・暗黒出血解除","死線の剣舞中は出血/暗黒出血無効"],
    "暗黒の靴":["回避率+25%","HP半分以下でさらに回避率+25%"]
   };
   const slot=slotMap[name]||"accessory";
   return {id:uid(),name,type:slot,slot,category:slot,rarity:"legendary",rarityName:"Legendary",frameColor:"purple",colorFrame:"purple",borderColor:"purple",specialFrame:"dark",darkEquip:true,isDarkEquip:true,level:n,plus:0,atk:Math.floor(30+n*4+Math.random()*n*2),attack:Math.floor(30+n*4+Math.random()*n*2),def:Math.floor(30+n*4+Math.random()*n*2),defense:Math.floor(30+n*4+Math.random()*n*2),hp:Math.floor(160+n*24+Math.random()*n*12),effects:effects[name]||[],specialEffects:effects[name]||[],locked:false};
 }
 function refresh(){["renderInventory","renderStorage","renderWarehouse","renderEquipment","renderAll"].forEach(n=>{try{if(typeof window[n]==="function")window[n]()}catch(e){}});try{if(typeof saveGame==="function")saveGame()}catch(e){};try{if(typeof save==="function")save()}catch(e){}}
 function grantDarkEquip(name){storageArray().push(makeDarkEquip(name));log(name+"を付与しました");refresh()}
 function grantDarkSet(){DARK_EQUIP_NAMES.forEach(n=>storageArray().push(makeDarkEquip(n)));log("闇装備セットを付与しました（7/7種）");refresh()}
 window.v986GrantDarkEquip=grantDarkEquip; window.v986GrantDarkSet=grantDarkSet;
 function addDebugButtons(){
   const roots=Array.from(document.querySelectorAll("div,section,aside")).filter(el=>{const t=el.textContent||"";return /デバッグ|Debug|敵即死|ユーザーリセット|暗黒剣聖/.test(t)&&el.offsetParent!==null&&el.children.length<220});
   const root=roots[0]; if(!root||document.getElementById("v986DarkDebugBox"))return;
   const box=document.createElement("div"); box.id="v986DarkDebugBox"; box.style.cssText="margin:8px 0;padding:8px;border:1px solid rgba(160,80,255,.75);border-radius:8px;background:rgba(20,0,35,.55);display:flex;gap:6px;flex-wrap:wrap;";
   box.innerHTML='<div style="width:100%;font-weight:bold;color:#d9b4ff;">闇装備付与</div>';
   const set=document.createElement("button"); set.type="button"; set.dataset.v986DarkSet="1"; set.textContent="闇装備セット(7種)"; box.appendChild(set);
   DARK_EQUIP_NAMES.forEach(name=>{const b=document.createElement("button");b.type="button";b.dataset.v986DarkEquip=name;b.textContent=name;box.appendChild(b)});
   root.appendChild(box);
 }
 document.addEventListener("pointerup",function(e){
   const set=e.target.closest("[data-v986-dark-set]"), eq=e.target.closest("[data-v986-dark-equip]");
   if(set){e.preventDefault();e.stopPropagation();grantDarkSet();return}
   if(eq){e.preventDefault();e.stopPropagation();grantDarkEquip(eq.dataset.v986DarkEquip);return}
 },true);
 function patchTouchButtons(){
   if(!matchMedia("(pointer: coarse)").matches)return;
   document.querySelectorAll("button,.btn,[role='button']").forEach(btn=>{
     if(btn.__v986Touch)return; btn.__v986Touch=true;
     btn.addEventListener("pointerup",function(e){if(e.target.closest("[data-v986-dark-set],[data-v986-dark-equip]"))return;setTimeout(()=>{try{btn.click()}catch(_){}},0)},{passive:true});
   });
 }
 function fixClipping(){
   document.body.style.overflowY="auto";
   document.querySelectorAll("#menuPanel,.menu-panel,#debugPanel,.debug-panel,.modal,.dialog,.popup,#mobileMenuPanel,.mobile-menu-panel,#sidePanel,.side-panel,.right-panel").forEach(el=>{el.style.maxHeight="calc(100dvh - 96px)";el.style.overflowY="auto";el.style.webkitOverflowScrolling="touch";el.style.boxSizing="border-box";el.style.paddingBottom="96px";el.style.pointerEvents="auto"});
   document.querySelectorAll(".cutin,.cutin-overlay,#cutin,#cutinOverlay,.boss-intro,.dark-cutin").forEach(el=>el.style.pointerEvents="none");
 }
 function findRightPanel(){return Array.from(document.querySelectorAll("#sidePanel,.side-panel,.right-panel,#rightPanel,.menu-panel,#mobileMenuPanel,.mobile-menu-panel,aside")).find(el=>el.offsetParent!==null&&el.getBoundingClientRect().width>250)||null}
 function classify(el){const t=(el.textContent||"").slice(0,400),c=((el.id||"")+" "+(el.className||"")).toLowerCase();if(/倉庫|経験値化|最強装備|表示/.test(t)||/storage|inventory|warehouse/.test(c))return"storage";if(/現在装備|装備\/強化|強化|武器|防具/.test(t)||/equip|enhance|upgrade/.test(c))return"equip";if(/バトルログ|ログ|ダメージ|ドロップ/.test(t)||/log/.test(c))return"log";if(/ステータス|攻撃力|防御力|討伐|現在Lv経験値/.test(t)||/status/.test(c))return"status";return""}
 function addPanelTabs(){const panel=findRightPanel();if(!panel||panel.querySelector(".v986-panel-tabs"))return;const tabs=document.createElement("div");tabs.className="v986-panel-tabs";[["status","ステータス"],["equip","装備/強化"],["storage","倉庫"],["log","ログ"]].forEach(([k,l])=>{const b=document.createElement("button");b.type="button";b.dataset.tab=k;b.textContent=l;b.addEventListener("click",()=>setTab(panel,k));tabs.appendChild(b)});panel.insertBefore(tabs,panel.firstChild);Array.from(panel.children).forEach(ch=>{if(ch===tabs)return;if(ch.dataset&&ch.dataset.v986Tab)return;const k=classify(ch);if(k)ch.dataset.v986Tab=k});setTab(panel,localStorage.getItem("v986RightTab")||"status")}
 function setTab(panel,k){panel.querySelectorAll(".v986-panel-tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===k));Array.from(panel.children).forEach(ch=>{if(ch.classList&&ch.classList.contains("v986-panel-tabs"))return;const tab=ch.dataset&&ch.dataset.v986Tab;if(tab)ch.classList.toggle("v986-tab-hidden",tab!==k)});localStorage.setItem("v986RightTab",k)}
 function isDarkEnemy(enemy){if(!enemy)enemy=window.currentEnemy||window.enemy||(window.state&&window.state.enemy)||(window.gameState&&window.gameState.enemy);if(!enemy)return false;return /暗黒剣聖|darkSword/i.test(String(enemy.name||enemy.id||enemy.type||""))}
 function clearDots(obj){if(!obj)return;["bleed","bleedStacks","bleeds","bleedList","darkBleed","darkBleedStacks","darkBleeds","darkBleedList","burn","poison"].forEach(k=>{if(Array.isArray(obj[k]))obj[k]=[];else if(obj[k]&&typeof obj[k]==="object")obj[k]={};else if(k in obj)obj[k]=0})}
 function resolveDssZeroHp(){const enemy=window.currentEnemy||window.enemy||(window.state&&window.state.enemy)||(window.gameState&&window.gameState.enemy);if(!isDarkEnemy(enemy))return;if((Number(enemy.hp)||0)>0)return;if(enemy.__v986Resolved)return;enemy.hp=0;enemy.dead=true;enemy.defeated=true;enemy.isDeadConfirmed=true;enemy.__v986Resolved=true;clearDots(enemy);clearDots(window.player||(window.state&&window.state.player)||(window.gameState&&window.gameState.player));["darkDanceTimer","darkDanceCutinTimer","darkDanceAttackTimer","darkDanceRecoveryTimer","darkTechniqueTimer","bleedTimer","darkBleedTimer","dotTimer"].forEach(k=>{try{if(window[k]){clearTimeout(window[k]);clearInterval(window[k]);window[k]=null}}catch(e){}});try{if(typeof processEnemyDefeat==="function"){processEnemyDefeat(enemy);return}}catch(e){};try{if(typeof defeatEnemy==="function"){defeatEnemy(enemy);return}}catch(e){};try{if(typeof onEnemyDefeated==="function"){onEnemyDefeated(enemy);return}}catch(e){}}
 function run(){ensureVersion();addDebugButtons();patchTouchButtons();fixClipping();addPanelTabs();resolveDssZeroHp()}
 document.addEventListener("DOMContentLoaded",run); setInterval(run,700);
})();
</script>

</body>
</html>
