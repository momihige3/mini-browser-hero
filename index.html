<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ミニブラウザヒーロー v24 高画質カード版</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game">
    <header class="topbar">
      <div class="brand">ミニブラウザヒーロー <span>高画質カードバトル</span></div>
      <div class="resources"><b id="gold">0</b> Gold / <b id="chests">0</b> 宝箱 / <b id="mats">0</b> 強化石</div>
      <div class="controls">
        <button id="autoBtn">AUTO ON</button>
        <button id="debugChestBtn">宝箱+10</button>
        <button id="muteBtn">MUTE OFF</button>
      </div>
    </header>

    <main class="layout">
      <section class="battle-panel">
        <div class="battle-bg"></div>
        <div class="battle-vignette"></div>
        <div id="levelEffect" class="level-effect hidden"><img src="assets/fx_levelup.png"><span>LEVEL UP!</span></div>
        <div id="centerBanner" class="center-banner hidden"></div>

        <div class="enemy-zone">
          <div class="name-line"><span id="enemyName">スライム</span><b id="enemyTag"></b></div>
          <div class="hpbar enemy-hp"><div id="enemyHpFill"></div><span id="enemyHpText"></span></div>
          <div id="enemyCard" class="card enemy-card">
            <img id="enemyImg" src="assets/enemy_slime.jpg" alt="敵" />
            <div class="card-flash"></div>
            <div id="enemyEffectLayer" class="effect-layer"></div>
            <div id="enemyFloats" class="float-layer"></div>
          </div>
        </div>

        <div class="hero-zone">
          <div class="name-line"><span>ハクスラ剣士</span><b id="heroLevel">Lv.1</b></div>
          <div class="hpbar hero-hp"><div id="heroHpFill"></div><span id="heroHpText"></span></div>
          <div id="heroCard" class="card hero-card">
            <img src="assets/hero_card.jpg" alt="主人公" />
            <div id="deathAura" class="death-aura hidden"></div>
            <div id="downOverlay" class="down-overlay hidden"><div class="down-text">DOWN...</div><strong id="downCount">5</strong></div>
            <div class="card-flash"></div>
          </div>
        </div>

        <div class="skill-row">
          <button class="skill active" data-skill="slash"><span>斬撃</span><em>物理</em></button>
          <button class="skill" data-skill="fire"><span>炎斬り</span><em>火属性</em></button>
          <button class="skill" data-skill="thunder"><span>雷撃</span><em>雷属性</em></button>
          <button class="skill" data-skill="multi"><span>連続攻撃</span><em>物理×3</em></button>
          <button class="skill" data-skill="heavy"><span>大攻撃</span><em>物理</em></button>
        </div>
      </section>

      <aside class="side-panel">
        <div class="panel hero-stats">
          <h2>ステータス</h2>
          <div class="stat-grid">
            <span>Lv</span><b id="statLv">1</b>
            <span>経験値</span><b id="statXp">0 / 80</b>
            <span>攻撃力</span><b id="statAtk">42</b>
            <span>防御力</span><b id="statDef">12</b>
            <span>火軽減</span><b id="statFireRes">0%</b>
            <span>雷軽減</span><b id="statThunderRes">0%</b>
          </div>
        </div>

        <div class="panel equip-panel">
          <h2>現在装備</h2>
          <div id="equipList" class="equip-list"></div>
          <button id="upgradeBtn" class="wide">装備を選択して強化</button>
          <div class="tiny-note">防具には属性軽減率が付くことがある</div>
        </div>

        <div class="panel inventory-panel">
          <h2>倉庫</h2>
          <div class="inventory-actions">
            <button id="openOneBtn">宝箱開封</button>
            <button id="openTenBtn">10個開封</button>
            <button id="bestEquipBtn">最強装備</button>
            <button id="sellCommonBtn">Common売却</button>
          </div>
          <div id="inventory" class="inventory"></div>
          <div id="tooltip" class="tooltip hidden"></div>
        </div>

        <div class="panel log-panel">
          <h2>バトルログ</h2>
          <div id="log" class="log"></div>
        </div>
      </aside>
    </main>
  </div>
  <script src="game.js"></script>
</body>
</html>
