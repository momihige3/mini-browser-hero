<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ミニブラウザヒーロー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span>⚔</span><div><h1>ミニブラウザヒーロー</h1><p>自動戦闘・装備ハクスラ・宝箱</p></div></div>
      <div id="topStats" class="top-stats"></div>
    </header>

    <main class="layout">
      <section class="left">
        <section class="panel battle-panel">
          <div class="stage-row"><b id="stageLabel">1-1</b><span id="enemyName">スライム</span></div>
          <div class="battlefield">
            <div class="unit-wrap enemy-wrap">
              <div class="hpplate enemy-hp"><span>敵HP</span><em id="enemyHpText">0/0</em><div class="bar"><i id="enemyHpBar"></i></div></div>
              <div id="enemy" class="unit enemy walking enter"><div class="slime-eye"></div></div>
            </div>
            <div id="slash" class="slash"></div>
            <div id="damageText" class="damage-text"></div>
            <div class="unit-wrap hero-wrap">
              <div class="hpplate hero-hp"><span>英雄HP</span><em id="heroHpText">0/0</em><div class="bar"><i id="heroHpBar"></i></div></div>
              <div id="hero" class="unit hero walking">
                <div class="hero-cape"></div><div class="hero-head"></div><div class="hero-hair"></div><div class="hero-body"></div><div class="hero-shield"></div><div class="hero-sword"></div><div class="hero-leg l1"></div><div class="hero-leg l2"></div>
              </div>
            </div>
            <div id="stageClear" class="battle-pop">STAGE CLEAR!</div>
            <div id="levelUp" class="battle-pop level">LEVEL UP!</div>
            <div id="chestAnim" class="chest-pop">📦</div>
          </div>
          <div class="exp-row"><span>EXP</span><div class="bar exp"><i id="expBar"></i></div><em id="expText">0/0</em></div>
        </section>

        <section class="panel warehouse">
          <div class="section-head"><h2>倉庫</h2><div class="actions"><button id="openChestBtn">宝箱を開ける ×0</button><button id="open10Btn">10個開封</button><button id="bestEquipBtn">最強装備を一括装備</button><button id="sortBtn">整頓</button><button id="bulkSellBtn">一括売却</button><button id="debugChestBtn">宝箱+10</button></div></div>
          <div id="inventory" class="inventory"></div>
        </section>
      </section>

      <aside class="right">
        <section class="panel hero-panel">
          <div class="section-head"><h2>英雄</h2><button id="upgradeBtn" disabled>装備を選択して強化</button></div>
          <div class="hero-grid">
            <div id="equipped" class="equipped"></div>
            <div class="side-info"><div id="heroStats" class="stats"></div><h3>所持素材</h3><div id="materials" class="materials"></div></div>
          </div>
        </section>
        <section class="panel settings-panel">
          <h2>設定・冒険</h2>
          <div class="settings-grid">
            <button id="muteBtn">SE ON</button><label>音量<input id="volume" type="range" min="0" max="100"></label>
            <label>ステージ<select id="stageSelect"></select></label><button id="goStage">移動</button>
            <button id="healBtn">回復</button><button id="saveBtn">保存</button><button id="debugModeBtn">デバッグOFF</button><button id="resetBtn">リセット</button>
          </div>
        </section>
        <section class="panel log-panel"><h2>ログ</h2><div id="log" class="log"></div></section>
      </aside>
    </main>
  </div>

  <div id="tooltip" class="tooltip"></div>
  <div id="itemDetail" class="item-detail"></div>
  <script src="game.js"></script>
</body>
</html>
