<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ミニブラウザヒーロー</title>
  <link rel="stylesheet" href="style.css" />

    <!-- Cloudflare Web Analytics -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"f48e7088e55c41f4a0a6044f8bf3531b"}'></script>
    <!-- End Cloudflare Web Analytics -->
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <div id="fixedBuildVersion" class="fixed-build-version">ver.98.5</div>
  <div id="game">
    <header class="topbar">
      <div class="brand">ミニブラウザヒーロー <span class="build-version">ver.98.5</span></div>
      <div class="resources"><b id="mats">0</b> 強化石</div>
      <div class="controls">
        <button id="equipToggleBtn">メニュー</button>
        <button id="debugBtn">デバッグ</button>
        <button id="muteBtn" class="mute-btn" type="button" aria-pressed="true">🔇 ミュート</button>
        <label class="volume-control">音量 <input id="volumeSlider" type="range" min="0" max="200" value="100" step="1"><span id="volumeText">100%</span></label>
      </div>
    </header>

    <main class="layout">
      <section class="battle-panel">
        <div class="battle-bg"></div>
        <div class="battle-vignette"></div>
        <div id="levelEffect" class="level-effect hidden"><img src="assets/fx_levelup.png"><span>LEVEL UP!</span></div>
        <div id="centerBanner" class="center-banner hidden"></div>
        <div id="dropToast" class="drop-toast hidden"></div>
        <div id="audioHint" class="audio-hint hidden">クリックで音声ON</div>

        <div class="enemy-zone">
          <div class="name-line"><span id="enemyName">スライム</span><span id="enemyLevel" class="enemy-level">Lv.1</span><b id="enemyTag"></b></div>
          <div class="hpbar enemy-hp"><div id="enemyHpFill"></div><span id="enemyHpText"></span></div>
          <div id="enemyCard" class="card enemy-card">
            <img id="enemyImg" src="assets/enemy_slime.jpg" alt="敵" />
            <div class="card-flash"></div>
            <div id="enemyEffectLayer" class="effect-layer"></div>
            <div id="enemyFloats" class="float-layer"></div>
          </div>
          <div id="enemyStatusList" class="status-list" aria-label="敵の状態"></div>
        </div>

        <div class="hero-zone">
          <div class="name-line"><span>騎士</span><em id="deathDanceStatus" class="dance-status hidden">死線の剣舞 残り10秒</em><b id="heroLevel">Lv.1</b></div>
          <div class="hpbar hero-hp"><div id="heroHpFill"></div><span id="heroHpText"></span></div>
          <div id="heroCard" class="card hero-card">
            <img src="assets/hero_card.jpg" alt="主人公" />
            <div id="deathAura" class="death-aura hidden"></div>
            <div id="downOverlay" class="down-overlay hidden"><div class="down-text">DOWN...</div><strong id="downCount">5</strong></div>
            <div class="card-flash"></div>
          </div>
          <div id="heroStatusList" class="status-list" aria-label="主人公の状態"></div>
        </div>
        <div class="expbar"><div id="expFill"></div><span id="expLabel">Lv.1 EXP 0 / 80</span><b id="expGainLabel">+0</b></div>
        <button id="fleeBtn" class="flee-btn" type="button">戦闘から逃げる</button>
      </section>

      <aside class="side-panel">
        <nav class="mobile-menu-tabs" aria-label="メニューページ切り替え">
          <button type="button" data-menu-page="stats" class="active">ステータス</button>
          <button type="button" data-menu-page="equip">装備/強化</button>
          <button type="button" data-menu-page="inventory">倉庫</button>
          <button type="button" data-menu-page="log">ログ</button>
        </nav>
        <div class="menu-col menu-left">
        <div class="panel hero-stats">
          <h2>ステータス</h2>
          <div class="stat-grid">
            <span>Lv</span><b id="statLv">1</b>
            <span>現在Lv経験値</span><b id="statXp">0 / 80</b>
            <span>次Lv必要</span><b id="statXpNext">80</b>
            <span>獲得経験値</span><b id="statXpGain">0</b>
            <span>攻撃力</span><b id="statAtk">42</b>
            <span>防御力</span><b id="statDef">12</b>
            <span>火軽減</span><b id="statFireRes">0%</b>
            </div>
          <div class="monster-records">
            <h3>モンスター討伐記録</h3>
            <div id="monsterRecords" class="monster-record-list"></div>
          </div>
        </div>

        <div class="panel equip-panel">
          <h2>現在装備</h2>
          <div id="equipList" class="equip-list"></div>
          <button id="upgradeBtn" class="wide">装備を選択して強化</button>
        </div>

        </div>
        <div class="menu-col menu-right">
        <div class="panel inventory-panel">
          <h2>倉庫</h2>
          <div class="inventory-actions">
            <button id="bestEquipBtn">最強装備</button>
            <div class="sell-box">
              <button id="sellSelectedBtn">経験値化</button>
              <label><input id="sellNormalChk" type="checkbox" checked>ノーマル</label>
              <label><input id="sellRareChk" type="checkbox">レア</label>
              <label><input id="sellLegendaryChk" type="checkbox">レジェンダリー</label>
            </div>
          </div>
          <div id="inventory" class="inventory"></div>
          <div id="tooltip" class="tooltip hidden"></div>
        </div>

        <div class="panel log-panel">
          <h2>バトルログ</h2>
          <div id="log" class="log"></div>
        </div>
        <div class="legal-links" aria-label="公開情報">
          <button id="creditBtn" type="button">クレジット</button>
          <button id="termsBtn" type="button">利用規約</button>
          <button id="privacyBtn" type="button">プライバシーポリシー</button>
        </div>
        </div>
      </aside>
    </main>
      <div id="debugPanel" class="debug-panel hidden">
        <div class="debug-head">デバッグ</div>
        <button id="debugAddChests">装備+50</button>
        <button id="debugResetData">ユーザーデータリセット</button>
        <button id="debugDarkSwordSaint">暗黒剣聖を強制召喚</button>
        <label><input id="debugKillEnemy" type="checkbox"> 敵への攻撃で即死</label>
        <label><input id="debugKillHero" type="checkbox"> 敵からの攻撃で即死</label>
        <div class="debug-version">Build: ver.98.5.2</div>
        <button id="debugClose">閉じる</button>
      </div>
  </div>

  <div id="legalModal" class="legal-modal hidden" role="dialog" aria-modal="true" aria-labelledby="legalModalTitle">
    <div class="legal-modal-backdrop" data-legal-close="1"></div>
    <div class="legal-modal-card">
      <button id="legalModalClose" class="legal-modal-close" type="button" aria-label="閉じる">×</button>
      <h2 id="legalModalTitle">クレジット</h2>
      <div id="legalModalBody" class="legal-modal-body"></div>
    </div>
  </div>


  <div id="deathDanceCutin" class="death-dance-cutin hidden" aria-live="polite">
    <div class="death-dance-cutin-strip">
      <img id="deathDanceCutinImg" src="assets/cutin_eye_1.jpg" alt="剣舞カットイン" />
      <div id="deathDanceCutinQuote" class="death-dance-cutin-quote">負けるわけにはいかない！</div>
    </div>
    <div class="death-dance-cutin-title">死線の剣舞</div>
  </div>

  <div id="fleeModal" class="flee-modal hidden" role="dialog" aria-modal="true" aria-labelledby="fleeModalTitle">
    <div class="flee-modal-backdrop"></div>
    <div class="flee-modal-card">
      <h2 id="fleeModalTitle">戦闘から離脱しますか？</h2>
      <p>敵の出現レベルが20下がります。<br>経験値は失いません。</p>
      <div class="flee-modal-actions">
        <button id="fleeCancelBtn" type="button">いいえ</button>
        <button id="fleeOkBtn" type="button">はい</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>

<style id="v981-mobile-favicon-fix-style">

  button, .btn, [role="button"] { touch-action: manipulation; }

    min-width: 44px !important;

    height: 44px !important;
    padding: 0 !important;

    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;

  }

    content: "🏃";
    font-size: 24px;
  }
  .status-popup-close, .buff-popup-close, .debuff-popup-close, .status-detail-close,
  #statusDetailClose, #statusPopupClose, .tooltip-close, .popup-close.status-close {

    overflow: auto !important;
  }
}
#gameVersion, .game-version, .version-label {
  pointer-events: none !important;
}
</style>
<script id="v981-mobile-favicon-fix-script">
(function(){
  const VERSION = "ver.98.5";
  const isTouchUI = () => window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

  function ensureVersion(){
    const title = document.querySelector(".title, #title, .game-title, h1");
    if (!title) return;
    let v = document.getElementById("gameVersion");
    if (!v) {
      v = document.createElement("span");
      v.id = "gameVersion";
      v.className = "game-version";
      title.style.position = title.style.position || "relative";
      title.appendChild(v);
    }
    v.textContent = VERSION;
    Object.assign(v.style, {
      position:"absolute", right:"0", bottom:"-0.85em",
      fontSize: isTouchUI() ? "10px" : "12px",
      opacity:"0.72", whiteSpace:"nowrap"
    });
  }

  function iconizeFlee(){
    const btns = Array.from(document.querySelectorAll("button, .btn, [role='button']")).filter(el => {
      const t = (el.textContent || "").trim();
      const idc = ((el.id || "") + " " + (el.className || "")).toLowerCase();
      return t.includes("戦闘から逃げる") || t.includes("逃走") || idc.includes("flee") || idc.includes("escape");
    });
    btns.forEach(btn => {
      if (isTouchUI()) {
        btn.dataset.fullText = btn.dataset.fullText || btn.textContent || "戦闘から逃げる";
        btn.textContent = "🏃";
        btn.title = "戦闘から逃げる";
        btn.setAttribute("aria-label","戦闘から逃げる");
        btn.style.minWidth = "44px";
        btn.style.width = "44px";
        btn.style.height = "44px";
        btn.style.fontSize = "24px";
        btn.style.borderRadius = "999px";
        btn.style.padding = "0";
      } else if (btn.dataset.fullText) {
        btn.textContent = btn.dataset.fullText;
      }
    });
  }

  function removeStatusCloseButtons(){
    document.querySelectorAll(".status-popup-close,.buff-popup-close,.debuff-popup-close,.status-detail-close,#statusDetailClose,#statusPopupClose,.tooltip-close,.popup-close.status-close")
      .forEach(el => el.remove());
  }

  function closeStatusPopupsOnOutsideTap(){
    document.addEventListener("pointerup", function(e){
      if (!isTouchUI()) return;
      const popup = e.target.closest(".status-popup,.status-detail-panel,#statusDetailPanel,#statusPopup,.tooltip,.buff-detail,.debuff-detail");
      const card = e.target.closest(".character-card,.enemy-card,.player-card,.card,.status-icon,.buff-icon,.debuff-icon");
      if (popup || card) return;
      document.querySelectorAll(".status-popup,.status-detail-panel,#statusDetailPanel,#statusPopup,.tooltip,.buff-detail,.debuff-detail")
        .forEach(el => {
          if (el.id === "statusDetailPanel" || el.id === "statusPopup") {
            el.style.display = "none";
            el.classList.add("hidden");
          } else if (el.classList.contains("status-popup") || el.classList.contains("tooltip") || el.classList.contains("buff-detail") || el.classList.contains("debuff-detail")) {
            el.style.display = "none";
          }
        });
    }, true);
  }

  function patchMobileItemTap(){
    document.addEventListener("pointerup", function(e){
      if (!isTouchUI()) return;
      const item = e.target.closest(".storage-item,.inventory-item,.equip-item,.equipment-item,[data-item-id],[data-equip-id]");
      if (!item) return;
      const inPanel = item.closest("#storagePanel,#inventoryPanel,#equipmentPanel,.storage,.inventory,.equipment,.warehouse");
      if (!inPanel) return;
      e.stopPropagation();

      // Try existing click handler first.
      if (typeof item.click === "function") {
        setTimeout(() => item.click(), 0);
      }

      // If an action menu already exists, make sure it is visible on mobile.
      setTimeout(() => {
        document.querySelectorAll(".equip-action-popup,.item-action-popup,.item-menu,.equip-menu,.context-menu")
          .forEach(menu => {
            menu.classList.add("v981-mobile");
            menu.style.zIndex = "50000";
            if (isTouchUI()) {
              menu.style.position = "fixed";
              menu.style.left = "50%";
              menu.style.top = "50%";
              menu.style.transform = "translate(-50%, -50%)";
              menu.style.display = "";
            }
          });
      }, 60);
    }, true);
  }

  function patchDebugDarkEquipmentLabels(){
    // This patch makes missing dark equipment names searchable/visible if debug text exists.
    const debug = Array.from(document.querySelectorAll("*")).find(el => /闇装備|デバッグ|Debug/.test(el.textContent || "") && el.children.length < 80);
    if (!debug || document.getElementById("v981DarkEquipNote")) return;
    const note = document.createElement("div");
    note.id = "v981DarkEquipNote";
    note.style.cssText = "font-size:12px;opacity:.8;margin-top:6px;";
    note.textContent = "闇装備セット対象：闇の聖剣 / 闇の盾 / 闇のアミュレット / 闇の鎧 / 闇の籠手 / 闇の兜 / 暗黒の靴";
    debug.appendChild(note);
  }

  function run(){
    ensureVersion();
    iconizeFlee();
    removeStatusCloseButtons();
    patchDebugDarkEquipmentLabels();
  }

  closeStatusPopupsOnOutsideTap();
  patchMobileItemTap();
  document.addEventListener("DOMContentLoaded", run);
  setInterval(run, 1000);
})();
</script>


<script id="v983-dark-debug-spawn-fix">
(function(){
  const VERSION = "ver.98.5";
  const DARK_EQUIP_NAMES = ["闇の聖剣","闇の盾","闇のアミュレット","闇の鎧","闇の籠手","闇の兜","暗黒の靴"];

  function safeLog(msg){
    try {
      if (typeof addLog === "function") addLog(msg, "system");
      else console.log(msg);
    } catch(e){ console.log(msg); }
  }

  function uid(){
    return "it_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }

  function getStateObj(){
    try {
      if (window.state && typeof window.state === "object") return window.state;
      if (window.gameState && typeof window.gameState === "object") return window.gameState;
      if (window.saveData && typeof window.saveData === "object") return window.saveData;
    } catch(e){}
    return null;
  }

  function getStorageArray(){
    const st = getStateObj();
    const candidates = [
      window.inventory, window.storage, window.warehouse,
      st && st.inventory, st && st.storage, st && st.warehouse, st && st.items
    ].filter(Array.isArray);
    if (candidates.length) return candidates[0];

    if (st) {
      st.inventory = [];
      return st.inventory;
    }
    window.inventory = [];
    return window.inventory;
  }

  function makeDarkEquip(name){
    const level =
      (window.player && (window.player.level || window.player.lv)) ||
      (window.state && window.state.level) ||
      1;

    const slotMap = {
      "闇の聖剣":"weapon",
      "闇の盾":"shield",
      "闇のアミュレット":"amulet",
      "闇の鎧":"armor",
      "闇の籠手":"gloves",
      "闇の兜":"helmet",
      "暗黒の靴":"boots"
    };

    const effects = {
      "闇の聖剣":["暗黒出血付与10%","連続攻撃100%"],
      "闇の盾":["毎ターン被ダメージ軽減+1%(最大50%)","被ダメージの50%回復"],
      "闇のアミュレット":["死線の剣舞発動率+25%","死線の剣舞効果時間2倍"],
      "闇の鎧":["被ダメージ25%軽減","1秒ごとにHP2%回復","暗黒出血最大20スタック"],
      "闇の籠手":["死線の剣舞時、剣舞発動回数+2"],
      "闇の兜":["死線の剣舞発動率+10%","出血・暗黒出血解除","死線の剣舞中は出血/暗黒出血無効"],
      "暗黒の靴":["回避率+25%","HP半分以下でさらに回避率+25%"]
    };

    const n = Math.max(1, Number(level) || 1);
    return {
      id: uid(),
      name,
      type: slotMap[name] || "accessory",
      slot: slotMap[name] || "accessory",
      rarity: "legendary",
      rarityName: "Legendary",
      frameColor: "purple",
      specialFrame: "dark",
      darkEquip: true,
      isDarkEquip: true,
      level: n,
      atk: Math.floor(20 + n * 3 + Math.random()*n*2),
      def: Math.floor(20 + n * 3 + Math.random()*n*2),
      hp: Math.floor(100 + n * 20 + Math.random()*n*10),
      effects: effects[name] || [],
      specialEffects: effects[name] || [],
      locked: false
    };
  }

  function grantDarkEquip(name){
    const arr = getStorageArray();
    arr.push(makeDarkEquip(name));
    safeLog(name + "を付与しました");
    try { if (typeof renderInventory === "function") renderInventory(); } catch(e){}
    try { if (typeof renderStorage === "function") renderStorage(); } catch(e){}
    try { if (typeof saveGame === "function") saveGame(); } catch(e){}
  }

  function grantDarkSet(){
    DARK_EQUIP_NAMES.forEach(grantDarkEquip);
    safeLog("闇装備セットを付与しました（7/7種）");
  }

  window.v983GrantDarkEquip = grantDarkEquip;
  window.v983GrantDarkSet = grantDarkSet;

  function addDebugButtons(){
    const roots = Array.from(document.querySelectorAll("*")).filter(el => {
      const t = el.textContent || "";
      return /デバッグ|Debug|暗黒剣聖|敵即死|ユーザーリセット/.test(t) && el.children.length < 120;
    });
    const root = roots[0];
    if (!root || document.getElementById("v983DarkDebugBox")) return;

    const box = document.createElement("div");
    box.id = "v983DarkDebugBox";
    box.style.cssText = "margin-top:8px;padding:8px;border:1px solid rgba(160,80,255,.5);border-radius:8px;background:rgba(20,0,35,.35);display:flex;gap:6px;flex-wrap:wrap;";
    const title = document.createElement("div");
    title.textContent = "闇装備デバッグ付与";
    title.style.cssText = "width:100%;font-weight:bold;color:#d9b4ff;";
    box.appendChild(title);

    const setBtn = document.createElement("button");
    setBtn.textContent = "闇装備セット(7種)";
    setBtn.type = "button";
    setBtn.addEventListener("click", (e)=>{ e.stopPropagation(); grantDarkSet(); });
    box.appendChild(setBtn);

    DARK_EQUIP_NAMES.forEach(name=>{
      const b = document.createElement("button");
      b.textContent = name;
      b.type = "button";
      b.addEventListener("click", (e)=>{ e.stopPropagation(); grantDarkEquip(name); });
      box.appendChild(b);
    });
    root.appendChild(box);
  }

  // Dark Sword Saint spawn/battle freeze guard
  function clearDarkTimers(){
    const names = [
      "darkDanceTimer","darkDanceCutinTimer","darkDanceAttackTimer","darkDanceRecoveryTimer",
      "darkTechniqueTimer","darkSwordDanceTimer","darkSwordSaintTimer","dssSpawnTimer",
      "cutinTimer","bossIntroTimer"
    ];
    names.forEach(n=>{
      try {
        if (window[n]) { clearTimeout(window[n]); clearInterval(window[n]); window[n]=null; }
      } catch(e){}
    });
  }

  function normalizeBattleAfterDssSpawn(){
    const enemy = window.currentEnemy || window.enemy || (window.state && window.state.enemy);
    if (!enemy) return;
    const nm = enemy.name || enemy.id || enemy.type || "";
    if (!/暗黒剣聖|darkSword/i.test(nm)) return;

    // if stuck in intro/cutin without active battle, release after grace time
    if (enemy.hp == null || enemy.hp <= 0) return;
    try {
      if (window.battlePaused && !window.__dssPauseSince) window.__dssPauseSince = Date.now();
      if (window.isBattlePaused && !window.__dssPauseSince) window.__dssPauseSince = Date.now();
      if (window.__dssPauseSince && Date.now() - window.__dssPauseSince > 3500) {
        window.battlePaused = false;
        window.isBattlePaused = false;
        window.__dssPauseSince = null;
        document.querySelectorAll(".cutin,.cutin-overlay,#cutin,#cutinOverlay,.boss-intro,.dark-cutin")
          .forEach(el => { el.style.pointerEvents="none"; el.style.display="none"; });
        safeLog("暗黒剣聖の登場演出を復帰しました");
      }
    } catch(e){}
  }

  // If HP0 and not already processed, force defeat flow to avoid lock.
  function forceDssZeroHpResolve(){
    const enemy = window.currentEnemy || window.enemy || (window.state && window.state.enemy);
    if (!enemy) return;
    const nm = enemy.name || enemy.id || enemy.type || "";
    if (!/暗黒剣聖|darkSword/i.test(nm)) return;
    if ((enemy.hp || 0) > 0) return;
    if (enemy.defeated || enemy.dead) return;
    enemy.hp = 0;
    enemy.dead = true;
    enemy.defeated = true;
    clearDarkTimers();
    try { if (typeof processEnemyDefeat === "function") processEnemyDefeat(enemy); return; } catch(e){}
    try { if (typeof defeatEnemy === "function") defeatEnemy(enemy); return; } catch(e){}
    try { if (typeof onEnemyDefeated === "function") onEnemyDefeated(enemy); return; } catch(e){}
    safeLog("暗黒剣聖を撃破しました");
  }

  function ensureVersion(){
    const title = document.querySelector(".title,#title,.game-title,h1");
    if (!title) return;
    let v = document.getElementById("gameVersion");
    if (!v) {
      v = document.createElement("span");
      v.id = "gameVersion";
      v.className = "game-version";
      title.style.position = title.style.position || "relative";
      title.appendChild(v);
    }
    v.textContent = VERSION;
  }

  function run(){
    ensureVersion();
    addDebugButtons();
    normalizeBattleAfterDssSpawn();
    forceDssZeroHpResolve();
  }

  document.addEventListener("DOMContentLoaded", run);
  setInterval(run, 700);
})();
</script>

<script id="v984-ui-dark-equip-fix-script">
(function(){
  const VERSION = "ver.98.5";
  const DARK_EQUIP_NAMES = ["闇の聖剣","闇の盾","闇のアミュレット","闇の鎧","闇の籠手","闇の兜","暗黒の靴"];

  function safeLog(msg){
    try { if (typeof addLog === "function") addLog(msg, "system"); else console.log(msg); }
    catch(e){ console.log(msg); }
  }
  function uid(){ return "it_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8); }

  function stateObj(){
    return (window.state && typeof window.state === "object" && window.state) ||
           (window.gameState && typeof window.gameState === "object" && window.gameState) ||
           (window.saveData && typeof window.saveData === "object" && window.saveData) || null;
  }
  function storageArray(){
    const st = stateObj();
    const arrs = [
      window.inventory, window.storage, window.warehouse,
      st && st.inventory, st && st.storage, st && st.warehouse, st && st.items
    ].filter(Array.isArray);
    if (arrs.length) return arrs[0];
    if (st) { st.inventory = []; return st.inventory; }
    window.inventory = []; return window.inventory;
  }
  function playerLevel(){
    return Number((window.player && (window.player.level || window.player.lv)) ||
      (stateObj() && (stateObj().level || stateObj().playerLevel)) || 1) || 1;
  }

  function makeDarkEquip(name){
    const level = Math.max(1, playerLevel());
    const slotMap = {
      "闇の聖剣":"weapon",
      "闇の盾":"shield",
      "闇のアミュレット":"amulet",
      "闇の鎧":"armor",
      "闇の籠手":"gloves",
      "闇の兜":"helmet",
      "暗黒の靴":"boots"
    };
    const effects = {
      "闇の聖剣":["通常攻撃・剣舞1ヒットごとに暗黒出血10%","連続攻撃100%"],
      "闇の盾":["毎ターン被ダメージ軽減+1%(最大50%)","被ダメージの50%回復"],
      "闇のアミュレット":["死線の剣舞発動率+25%","死線の剣舞効果時間2倍"],
      "闇の鎧":["被ダメージ25%軽減","1秒ごとにHP2%回復","暗黒出血最大20スタック"],
      "闇の籠手":["死線の剣舞時、剣舞発動回数+2"],
      "闇の兜":["死線の剣舞発動率+10%","出血・暗黒出血解除","死線の剣舞中は出血/暗黒出血無効"],
      "暗黒の靴":["回避率+25%","HP半分以下でさらに回避率+25%"]
    };
    const slot = slotMap[name] || "accessory";
    const n = level;
    return {
      id: uid(),
      name,
      type: slot,
      slot,
      category: slot,
      rarity: "legendary",
      rarityName: "Legendary",
      colorFrame: "purple",
      frameColor: "purple",
      borderColor: "purple",
      specialFrame: "dark",
      darkEquip: true,
      isDarkEquip: true,
      level: n,
      plus: 0,
      atk: Math.floor(30 + n * 4 + Math.random()*n*2),
      attack: Math.floor(30 + n * 4 + Math.random()*n*2),
      def: Math.floor(30 + n * 4 + Math.random()*n*2),
      defense: Math.floor(30 + n * 4 + Math.random()*n*2),
      hp: Math.floor(160 + n * 24 + Math.random()*n*12),
      effects: effects[name] || [],
      specialEffects: effects[name] || [],
      locked: false
    };
  }

  function grantDarkEquip(name){
    const arr = storageArray();
    arr.push(makeDarkEquip(name));
    safeLog(name + "を付与しました");
    try { if (typeof renderInventory === "function") renderInventory(); } catch(e){}
    try { if (typeof renderStorage === "function") renderStorage(); } catch(e){}
    try { if (typeof renderWarehouse === "function") renderWarehouse(); } catch(e){}
    try { if (typeof saveGame === "function") saveGame(); } catch(e){}
    try { if (typeof save === "function") save(); } catch(e){}
  }
  function grantDarkSet(){
    DARK_EQUIP_NAMES.forEach(grantDarkEquip);
    safeLog("闇装備セットを付与しました（7/7種）");
  }
  window.v984GrantDarkEquip = grantDarkEquip;
  window.v984GrantDarkSet = grantDarkSet;

  function addDebugButtons(){
    const roots = Array.from(document.querySelectorAll("div,section,aside")).filter(el => {
      const t = el.textContent || "";
      return /デバッグ|Debug|敵即死|ユーザーリセット|暗黒剣聖/.test(t) && el.offsetParent !== null && el.children.length < 180;
    });
    const root = roots[0];
    if (!root || document.getElementById("v984DarkDebugBox")) return;
    const box = document.createElement("div");
    box.id = "v984DarkDebugBox";
    box.style.cssText = "margin:8px 0;padding:8px;border:1px solid rgba(160,80,255,.7);border-radius:8px;background:rgba(20,0,35,.5);display:flex;gap:6px;flex-wrap:wrap;";
    const title = document.createElement("div");
    title.textContent = "闇装備付与";
    title.style.cssText = "width:100%;font-weight:bold;color:#d9b4ff;";
    box.appendChild(title);
    const all = document.createElement("button");
    all.type = "button";
    all.textContent = "闇装備セット(7種)";
    all.addEventListener("click", e => { e.stopPropagation(); grantDarkSet(); });
    box.appendChild(all);
    DARK_EQUIP_NAMES.forEach(name => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = name;
      b.addEventListener("click", e => { e.stopPropagation(); grantDarkEquip(name); });
      box.appendChild(b);
    });
    root.appendChild(box);
  }

  function ensureVersion(){
    const title = document.querySelector(".title,#title,.game-title,h1");
    if (!title) return;
    let v = document.getElementById("gameVersion");
    if (!v) {
      v = document.createElement("span");
      v.id = "gameVersion";
      v.className = "game-version";
      title.style.position = title.style.position || "relative";
      title.appendChild(v);
    }
    v.textContent = VERSION;
  }

  function findRightPanel(){
    const candidates = Array.from(document.querySelectorAll("#sidePanel,.side-panel,.right-panel,#rightPanel,.menu-panel,#mobileMenuPanel,.mobile-menu-panel,aside"))
      .filter(el => el.offsetParent !== null && el.getBoundingClientRect().width > 250);
    if (candidates.length) return candidates[0];
    return null;
  }

  function classifyPanelChild(el){
    const t = (el.textContent || "").slice(0,300);
    const idc = ((el.id||"") + " " + (el.className||"")).toLowerCase();
    if (/倉庫|経験値化|最強装備|表示/.test(t) || /storage|inventory|warehouse/.test(idc)) return "storage";
    if (/現在装備|装備\/強化|強化|武器|防具/.test(t) || /equip|enhance|upgrade/.test(idc)) return "equip";
    if (/バトルログ|ログ|ダメージ|ドロップ/.test(t) || /log/.test(idc)) return "log";
    if (/ステータス|Lv|攻撃力|防御力|討伐/.test(t) || /status/.test(idc)) return "status";
    return "";
  }

  function addPanelTabs(){
    const panel = findRightPanel();
    if (!panel || panel.querySelector(".v984-panel-tabs")) return;
    const tabs = document.createElement("div");
    tabs.className = "v984-panel-tabs";
    const labels = [
      ["status","ステータス"],
      ["equip","装備/強化"],
      ["storage","倉庫"],
      ["log","ログ"]
    ];
    labels.forEach(([key,label])=>{
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.tab = key;
      b.textContent = label;
      b.addEventListener("click",()=>setActiveTab(panel,key));
      tabs.appendChild(b);
    });
    panel.insertBefore(tabs, panel.firstChild);

    Array.from(panel.children).forEach(ch => {
      if (ch === tabs) return;
      if (ch.dataset && ch.dataset.v984Tab) return;
      const key = classifyPanelChild(ch);
      if (key) ch.dataset.v984Tab = key;
    });
    setActiveTab(panel, localStorage.getItem("v984RightTab") || "status");
  }

  function setActiveTab(panel,key){
    panel.querySelectorAll(".v984-panel-tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === key));
    Array.from(panel.children).forEach(ch => {
      if (ch.classList && ch.classList.contains("v984-panel-tabs")) return;
      const tab = ch.dataset && ch.dataset.v984Tab;
      if (!tab) return;
      ch.classList.toggle("v984-tab-hidden", tab !== key);
    });
    localStorage.setItem("v984RightTab", key);
  }

  function fixClipping(){
    document.body.style.overflowY = "auto";
    const panel = findRightPanel();
    if (panel) {
      panel.style.maxHeight = "calc(100vh - 110px)";
      panel.style.overflowY = "auto";
      panel.style.paddingBottom = "72px";
      panel.style.boxSizing = "border-box";
    }
    const battle = document.querySelector("#battleArea,.battle-area,.battle-screen,.battle-panel");
    if (battle) {
      battle.style.paddingBottom = "72px";
      battle.style.boxSizing = "border-box";
    }
  }

  function run(){
    ensureVersion();
    addDebugButtons();
    addPanelTabs();
    fixClipping();
  }
  document.addEventListener("DOMContentLoaded", run);
  setInterval(run, 1000);
})();
</script>


<script id="v984-dss-dot-defeat-fix">
(function(){
  function isDss(enemy){
    if(!enemy) return false;
    const s = String(enemy.name || enemy.id || enemy.type || "");
    return /暗黒剣聖|darkSword/i.test(s);
  }

  function clearDots(obj){
    if(!obj) return;
    const keys = [
      "bleed","bleedStacks","bleeds","bleedList",
      "darkBleed","darkBleedStacks","darkBleeds","darkBleedList",
      "dark_bleed","dark_bleed_stacks",
      "burn","burnStacks","poison","poisonStacks"
    ];
    keys.forEach(k=>{
      if (Array.isArray(obj[k])) obj[k] = [];
      else if (obj[k] && typeof obj[k] === "object") obj[k] = {};
      else if (k in obj) obj[k] = 0;
    });
    if (obj.statuses && typeof obj.statuses === "object") {
      ["bleed","darkBleed","dark_bleed","burn","poison"].forEach(k=>delete obj.statuses[k]);
    }
    if (obj.debuffs && typeof obj.debuffs === "object") {
      ["bleed","darkBleed","dark_bleed","burn","poison"].forEach(k=>delete obj.debuffs[k]);
    }
  }

  function clearDotTimers(){
    [
      "bleedTimer","darkBleedTimer","dotTimer","statusTimer",
      "enemyBleedTimer","enemyDarkBleedTimer",
      "playerBleedTimer","playerDarkBleedTimer"
    ].forEach(k=>{
      try {
        if (window[k]) {
          clearTimeout(window[k]);
          clearInterval(window[k]);
          window[k] = null;
        }
      } catch(e){}
    });
  }

  function clearDarkActionTimers(){
    [
      "darkDanceTimer","darkDanceCutinTimer","darkDanceAttackTimer",
      "darkDanceRecoveryTimer","darkTechniqueTimer","darkSwordDanceTimer",
      "darkSwordSaintTimer","dssSpawnTimer","cutinTimer","bossIntroTimer"
    ].forEach(k=>{
      try {
        if (window[k]) {
          clearTimeout(window[k]);
          clearInterval(window[k]);
          window[k] = null;
        }
      } catch(e){}
    });
  }

  function resolveDssZeroHp(){
    const enemy = window.currentEnemy || window.enemy || (window.state && window.state.enemy) || (window.gameState && window.gameState.enemy);
    if (!isDss(enemy)) return;
    if ((Number(enemy.hp) || 0) > 0) return;
    if (enemy.__v984DotDefeatResolved) return;

    enemy.hp = 0;
    enemy.dead = true;
    enemy.defeated = true;
    enemy.isDeadConfirmed = true;
    enemy.__v984DotDefeatResolved = true;

    const player = window.player || (window.state && window.state.player) || (window.gameState && window.gameState.player);
    clearDots(enemy);
    clearDots(player);
    clearDotTimers();
    clearDarkActionTimers();

    document.querySelectorAll(".cutin,.cutin-overlay,#cutin,#cutinOverlay,.boss-intro,.dark-cutin")
      .forEach(el => { el.style.pointerEvents = "none"; el.style.display = "none"; });

    try { if (typeof processEnemyDefeat === "function") { processEnemyDefeat(enemy); return; } } catch(e){}
    try { if (typeof defeatEnemy === "function") { defeatEnemy(enemy); return; } } catch(e){}
    try { if (typeof onEnemyDefeated === "function") { onEnemyDefeated(enemy); return; } } catch(e){}
    try { if (typeof nextEnemy === "function") { nextEnemy(); return; } } catch(e){}
  }

  setInterval(resolveDssZeroHp, 200);
})();
</script>


<script id="v985-dark-audio-fix">
(function(){
  const DARK_BGM = "March_of_the_Iron_Saint.mp3";
  let darkVoiceLockUntil = 0;
  let lastDarkVoiceAt = 0;

  function isDarkEnemy(enemy){
    if (!enemy) enemy = window.currentEnemy || window.enemy || (window.state && window.state.enemy) || (window.gameState && window.gameState.enemy);
    if (!enemy) return false;
    const s = String(enemy.name || enemy.id || enemy.type || "");
    return /暗黒剣聖|darkSword/i.test(s);
  }

  function isMuted(){
    return !!(window.isMuted || window.muted || (window.state && window.state.muted) || (window.gameState && window.gameState.muted));
  }

  function audioEls(){
    return Array.from(document.querySelectorAll("audio"));
  }

  function isDarkBgmAudio(a){
    const src = String(a.currentSrc || a.src || "");
    return src.includes(DARK_BGM) || src.includes("Iron_Saint") || src.includes("dark-bgm") || a.id === "darkBgm";
  }

  function isVoiceAudio(a){
    const src = String(a.currentSrc || a.src || "");
    return src.includes("DarkKnigtVoice") || src.includes("DarkKnightVoice") || src.includes("voice") || a.id === "darkVoice";
  }

  function isNormalBgmAudio(a){
    return !isDarkBgmAudio(a) && !isVoiceAudio(a);
  }

  function getOrCreateDarkBgm(){
    let a = audioEls().find(isDarkBgmAudio);
    if (!a) {
      a = document.createElement("audio");
      a.id = "darkBgm";
      a.src = DARK_BGM;
      a.loop = true;
      a.preload = "auto";
      document.body.appendChild(a);
    }
    a.volume = 0.05;
    a.loop = true;
    return a;
  }

  function forceDarkBgm(){
    if (!isDarkEnemy() || isMuted()) return;
    const dark = getOrCreateDarkBgm();

    audioEls().forEach(a => {
      if (a === dark || isVoiceAudio(a)) return;
      if (isNormalBgmAudio(a)) {
        try { a.pause(); } catch(e){}
      }
    });

    try {
      dark.volume = 0.05;
      if (dark.paused) {
        const p = dark.play();
        if (p && p.catch) p.catch(()=>{});
      }
    } catch(e){}
  }

  function stopDuplicateVoices(){
    const voices = audioEls().filter(isVoiceAudio);
    if (voices.length <= 1) return;
    voices.forEach((a, i) => {
      if (i === voices.length - 1) return;
      try { a.pause(); a.currentTime = 0; } catch(e){}
    });
  }

  function guardVoicePlay(){
    audioEls().filter(isVoiceAudio).forEach(a => {
      if (a.__v985Guarded) return;
      a.__v985Guarded = true;
      a.volume = 0.25;
      a.addEventListener("play", () => {
        const now = Date.now();
        if (now < darkVoiceLockUntil || now - lastDarkVoiceAt < 1200) {
          try { a.pause(); a.currentTime = 0; } catch(e){}
          return;
        }
        lastDarkVoiceAt = now;
        darkVoiceLockUntil = now + 1200;
        a.volume = 0.25;
        stopDuplicateVoices();
      }, true);
    });
  }

  function patchGlobalVoiceFns(){
    const names = ["playDarkVoice","playDarkKnightVoice","playDarkCutinVoice","playDarkSwordDanceVoice"];
    names.forEach(n => {
      const fn = window[n];
      if (typeof fn !== "function" || fn.__v985Patched) return;
      const wrapped = function(){
        const now = Date.now();
        if (now < darkVoiceLockUntil || now - lastDarkVoiceAt < 1200) return;
        lastDarkVoiceAt = now;
        darkVoiceLockUntil = now + 1200;
        return fn.apply(this, arguments);
      };
      wrapped.__v985Patched = true;
      window[n] = wrapped;
    });
  }

  function keepDarkBgmDuringDarkBattle(){
    if (isDarkEnemy()) forceDarkBgm();
  }

  // Patch common BGM functions so normal BGM cannot override during Dark Sword Saint battle.
  function patchBgmFns(){
    const names = ["playBgm","playBGM","startBgm","startBGM","playNormalBgm","playNormalBGM","resumeCurrentBgm","resumeCurrentBGM"];
    names.forEach(n => {
      const fn = window[n];
      if (typeof fn !== "function" || fn.__v985Patched) return;
      const wrapped = function(){
        const args = Array.from(arguments);
        if (isDarkEnemy()) {
          setTimeout(forceDarkBgm, 0);
          const joined = args.map(x => String(x)).join(" ");
          if (!joined.includes("Iron_Saint") && !joined.includes("dark")) {
            return forceDarkBgm();
          }
        }
        return fn.apply(this, arguments);
      };
      wrapped.__v985Patched = true;
      window[n] = wrapped;
    });
  }

  function run(){
    guardVoicePlay();
    patchGlobalVoiceFns();
    patchBgmFns();
    keepDarkBgmDuringDarkBattle();
  }

  document.addEventListener("DOMContentLoaded", run);
  setInterval(run, 500);
})();
</script>
