<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ミニブラウザヒーロー</title>
  <link rel="stylesheet" href="style.css" />

    <!-- Cloudflare Web Analytics -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"f48e7088e55c41f4a0a6044f8bf3531b"}'></script>
    <!-- End Cloudflare Web Analytics -->
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <div id="fixedBuildVersion" class="fixed-build-version">ver.98.2</div>
  <div id="game">
    <header class="topbar">
      <div class="brand">ミニブラウザヒーロー <span class="build-version">ver.98.2</span></div>
      <div class="resources"><b id="mats">0</b> 強化石</div>
      <div class="controls">
        <button id="equipToggleBtn">メニュー</button>
        <button id="debugBtn">デバッグ</button>
        <button id="muteBtn" class="mute-btn" type="button" aria-pressed="true">🔇 ミュート</button>
        <label class="volume-control">音量 <input id="volumeSlider" type="range" min="0" max="200" value="100" step="1"><span id="volumeText">100%</span></label>
      </div>
    </header>

    <main class="layout">
      <section class="battle-panel">
        <div class="battle-bg"></div>
        <div class="battle-vignette"></div>
        <div id="levelEffect" class="level-effect hidden"><img src="assets/fx_levelup.png"><span>LEVEL UP!</span></div>
        <div id="centerBanner" class="center-banner hidden"></div>
        <div id="dropToast" class="drop-toast hidden"></div>
        <div id="audioHint" class="audio-hint hidden">クリックで音声ON</div>

        <div class="enemy-zone">
          <div class="name-line"><span id="enemyName">スライム</span><span id="enemyLevel" class="enemy-level">Lv.1</span><b id="enemyTag"></b></div>
          <div class="hpbar enemy-hp"><div id="enemyHpFill"></div><span id="enemyHpText"></span></div>
          <div id="enemyCard" class="card enemy-card">
            <img id="enemyImg" src="assets/enemy_slime.jpg" alt="敵" />
            <div class="card-flash"></div>
            <div id="enemyEffectLayer" class="effect-layer"></div>
            <div id="enemyFloats" class="float-layer"></div>
          </div>
          <div id="enemyStatusList" class="status-list" aria-label="敵の状態"></div>
        </div>

        <div class="hero-zone">
          <div class="name-line"><span>騎士</span><em id="deathDanceStatus" class="dance-status hidden">死線の剣舞 残り10秒</em><b id="heroLevel">Lv.1</b></div>
          <div class="hpbar hero-hp"><div id="heroHpFill"></div><span id="heroHpText"></span></div>
          <div id="heroCard" class="card hero-card">
            <img src="assets/hero_card.jpg" alt="主人公" />
            <div id="deathAura" class="death-aura hidden"></div>
            <div id="downOverlay" class="down-overlay hidden"><div class="down-text">DOWN...</div><strong id="downCount">5</strong></div>
            <div class="card-flash"></div>
          </div>
          <div id="heroStatusList" class="status-list" aria-label="主人公の状態"></div>
        </div>
        <div class="expbar"><div id="expFill"></div><span id="expLabel">Lv.1 EXP 0 / 80</span><b id="expGainLabel">+0</b></div>
        <button id="fleeBtn" class="flee-btn" type="button">戦闘から逃げる</button>
      </section>

      <aside class="side-panel">
        <nav class="mobile-menu-tabs" aria-label="メニューページ切り替え">
          <button type="button" data-menu-page="stats" class="active">ステータス</button>
          <button type="button" data-menu-page="equip">装備/強化</button>
          <button type="button" data-menu-page="inventory">倉庫</button>
          <button type="button" data-menu-page="log">ログ</button>
        </nav>
        <div class="menu-col menu-left">
        <div class="panel hero-stats">
          <h2>ステータス</h2>
          <div class="stat-grid">
            <span>Lv</span><b id="statLv">1</b>
            <span>現在Lv経験値</span><b id="statXp">0 / 80</b>
            <span>次Lv必要</span><b id="statXpNext">80</b>
            <span>獲得経験値</span><b id="statXpGain">0</b>
            <span>攻撃力</span><b id="statAtk">42</b>
            <span>防御力</span><b id="statDef">12</b>
            <span>火軽減</span><b id="statFireRes">0%</b>
            </div>
          <div class="monster-records">
            <h3>モンスター討伐記録</h3>
            <div id="monsterRecords" class="monster-record-list"></div>
          </div>
        </div>

        <div class="panel equip-panel">
          <h2>現在装備</h2>
          <div id="equipList" class="equip-list"></div>
          <button id="upgradeBtn" class="wide">装備を選択して強化</button>
        </div>

        </div>
        <div class="menu-col menu-right">
        <div class="panel inventory-panel">
          <h2>倉庫</h2>
          <div class="inventory-actions">
            <button id="bestEquipBtn">最強装備</button>
            <div class="sell-box">
              <button id="sellSelectedBtn">経験値化</button>
              <label><input id="sellNormalChk" type="checkbox" checked>ノーマル</label>
              <label><input id="sellRareChk" type="checkbox">レア</label>
              <label><input id="sellLegendaryChk" type="checkbox">レジェンダリー</label>
            </div>
          </div>
          <div id="inventory" class="inventory"></div>
          <div id="tooltip" class="tooltip hidden"></div>
        </div>

        <div class="panel log-panel">
          <h2>バトルログ</h2>
          <div id="log" class="log"></div>
        </div>
        <div class="legal-links" aria-label="公開情報">
          <button id="creditBtn" type="button">クレジット</button>
          <button id="termsBtn" type="button">利用規約</button>
          <button id="privacyBtn" type="button">プライバシーポリシー</button>
        </div>
        </div>
      </aside>
    </main>
      <div id="debugPanel" class="debug-panel hidden">
        <div class="debug-head">デバッグ</div>
        <button id="debugAddChests">装備+50</button>
        <button id="debugResetData">ユーザーデータリセット</button>
        <button id="debugDarkSwordSaint">暗黒剣聖を強制召喚</button>
        <label><input id="debugKillEnemy" type="checkbox"> 敵への攻撃で即死</label>
        <label><input id="debugKillHero" type="checkbox"> 敵からの攻撃で即死</label>
        <div class="debug-version">Build: ver.98.2.2</div>
        <button id="debugClose">閉じる</button>
      </div>
  </div>

  <div id="legalModal" class="legal-modal hidden" role="dialog" aria-modal="true" aria-labelledby="legalModalTitle">
    <div class="legal-modal-backdrop" data-legal-close="1"></div>
    <div class="legal-modal-card">
      <button id="legalModalClose" class="legal-modal-close" type="button" aria-label="閉じる">×</button>
      <h2 id="legalModalTitle">クレジット</h2>
      <div id="legalModalBody" class="legal-modal-body"></div>
    </div>
  </div>


  <div id="deathDanceCutin" class="death-dance-cutin hidden" aria-live="polite">
    <div class="death-dance-cutin-strip">
      <img id="deathDanceCutinImg" src="assets/cutin_eye_1.jpg" alt="剣舞カットイン" />
      <div id="deathDanceCutinQuote" class="death-dance-cutin-quote">負けるわけにはいかない！</div>
    </div>
    <div class="death-dance-cutin-title">死線の剣舞</div>
  </div>

  <div id="fleeModal" class="flee-modal hidden" role="dialog" aria-modal="true" aria-labelledby="fleeModalTitle">
    <div class="flee-modal-backdrop"></div>
    <div class="flee-modal-card">
      <h2 id="fleeModalTitle">戦闘から離脱しますか？</h2>
      <p>敵の出現レベルが20下がります。<br>経験値は失いません。</p>
      <div class="flee-modal-actions">
        <button id="fleeCancelBtn" type="button">いいえ</button>
        <button id="fleeOkBtn" type="button">はい</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>

<style id="v981-mobile-favicon-fix-style">
@media (pointer: coarse), (max-width: 820px) {
  button, .btn, [role="button"] { touch-action: manipulation; }
  #fleeBtn, .flee-btn, #fleeButton, .escape-btn, #escapeBtn {
    min-width: 44px !important;
    width: 44px !important;
    height: 44px !important;
    padding: 0 !important;
    font-size: 0 !important;
    border-radius: 999px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    line-height: 1 !important;
  }
  #fleeBtn::before, .flee-btn::before, #fleeButton::before, .escape-btn::before, #escapeBtn::before {
    content: "🏃";
    font-size: 24px;
  }
  .status-popup-close, .buff-popup-close, .debuff-popup-close, .status-detail-close,
  #statusDetailClose, #statusPopupClose, .tooltip-close, .popup-close.status-close {
    display: none !important;
  }
  .equip-action-popup.v981-mobile, .item-action-popup.v981-mobile {
    position: fixed !important;
    left: 50% !important;
    top: 50% !important;
    transform: translate(-50%, -50%) !important;
    z-index: 50000 !important;
    width: min(92vw, 360px) !important;
    max-height: 80vh !important;
    overflow: auto !important;
  }
}
#gameVersion, .game-version, .version-label {
  pointer-events: none !important;
}
</style>
<script id="v981-mobile-favicon-fix-script">
(function(){
  const VERSION = "ver.98.2";
  const isTouchUI = () => window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

  function ensureVersion(){
    const title = document.querySelector(".title, #title, .game-title, h1");
    if (!title) return;
    let v = document.getElementById("gameVersion");
    if (!v) {
      v = document.createElement("span");
      v.id = "gameVersion";
      v.className = "game-version";
      title.style.position = title.style.position || "relative";
      title.appendChild(v);
    }
    v.textContent = VERSION;
    Object.assign(v.style, {
      position:"absolute", right:"0", bottom:"-0.85em",
      fontSize: isTouchUI() ? "10px" : "12px",
      opacity:"0.72", whiteSpace:"nowrap"
    });
  }

  function iconizeFlee(){
    const btns = Array.from(document.querySelectorAll("button, .btn, [role='button']")).filter(el => {
      const t = (el.textContent || "").trim();
      const idc = ((el.id || "") + " " + (el.className || "")).toLowerCase();
      return t.includes("戦闘から逃げる") || t.includes("逃走") || idc.includes("flee") || idc.includes("escape");
    });
    btns.forEach(btn => {
      if (isTouchUI()) {
        btn.dataset.fullText = btn.dataset.fullText || btn.textContent || "戦闘から逃げる";
        btn.textContent = "🏃";
        btn.title = "戦闘から逃げる";
        btn.setAttribute("aria-label","戦闘から逃げる");
        btn.style.minWidth = "44px";
        btn.style.width = "44px";
        btn.style.height = "44px";
        btn.style.fontSize = "24px";
        btn.style.borderRadius = "999px";
        btn.style.padding = "0";
      } else if (btn.dataset.fullText) {
        btn.textContent = btn.dataset.fullText;
      }
    });
  }

  function removeStatusCloseButtons(){
    document.querySelectorAll(".status-popup-close,.buff-popup-close,.debuff-popup-close,.status-detail-close,#statusDetailClose,#statusPopupClose,.tooltip-close,.popup-close.status-close")
      .forEach(el => el.remove());
  }

  function closeStatusPopupsOnOutsideTap(){
    document.addEventListener("pointerup", function(e){
      if (!isTouchUI()) return;
      const popup = e.target.closest(".status-popup,.status-detail-panel,#statusDetailPanel,#statusPopup,.tooltip,.buff-detail,.debuff-detail");
      const card = e.target.closest(".character-card,.enemy-card,.player-card,.card,.status-icon,.buff-icon,.debuff-icon");
      if (popup || card) return;
      document.querySelectorAll(".status-popup,.status-detail-panel,#statusDetailPanel,#statusPopup,.tooltip,.buff-detail,.debuff-detail")
        .forEach(el => {
          if (el.id === "statusDetailPanel" || el.id === "statusPopup") {
            el.style.display = "none";
            el.classList.add("hidden");
          } else if (el.classList.contains("status-popup") || el.classList.contains("tooltip") || el.classList.contains("buff-detail") || el.classList.contains("debuff-detail")) {
            el.style.display = "none";
          }
        });
    }, true);
  }

  function patchMobileItemTap(){
    document.addEventListener("pointerup", function(e){
      if (!isTouchUI()) return;
      const item = e.target.closest(".storage-item,.inventory-item,.equip-item,.equipment-item,[data-item-id],[data-equip-id]");
      if (!item) return;
      const inPanel = item.closest("#storagePanel,#inventoryPanel,#equipmentPanel,.storage,.inventory,.equipment,.warehouse");
      if (!inPanel) return;
      e.stopPropagation();

      // Try existing click handler first.
      if (typeof item.click === "function") {
        setTimeout(() => item.click(), 0);
      }

      // If an action menu already exists, make sure it is visible on mobile.
      setTimeout(() => {
        document.querySelectorAll(".equip-action-popup,.item-action-popup,.item-menu,.equip-menu,.context-menu")
          .forEach(menu => {
            menu.classList.add("v981-mobile");
            menu.style.zIndex = "50000";
            if (isTouchUI()) {
              menu.style.position = "fixed";
              menu.style.left = "50%";
              menu.style.top = "50%";
              menu.style.transform = "translate(-50%, -50%)";
              menu.style.display = "";
            }
          });
      }, 60);
    }, true);
  }

  function patchDebugDarkEquipmentLabels(){
    // This patch makes missing dark equipment names searchable/visible if debug text exists.
    const debug = Array.from(document.querySelectorAll("*")).find(el => /闇装備|デバッグ|Debug/.test(el.textContent || "") && el.children.length < 80);
    if (!debug || document.getElementById("v981DarkEquipNote")) return;
    const note = document.createElement("div");
    note.id = "v981DarkEquipNote";
    note.style.cssText = "font-size:12px;opacity:.8;margin-top:6px;";
    note.textContent = "闇装備セット対象：闇の聖剣 / 闇の盾 / 闇のアミュレット / 闇の鎧 / 闇の籠手 / 闇の兜 / 暗黒の靴";
    debug.appendChild(note);
  }

  function run(){
    ensureVersion();
    iconizeFlee();
    removeStatusCloseButtons();
    patchDebugDarkEquipmentLabels();
  }

  closeStatusPopupsOnOutsideTap();
  patchMobileItemTap();
  document.addEventListener("DOMContentLoaded", run);
  setInterval(run, 1000);
})();
</script>

</body>
</html>
